name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Verify panel markup matches schema
        run: node scripts/check-panel.mjs

      - name: Verify JSON5 grammar
        run: node scripts/check-json5.mjs

      - name: Build bundle
        run: pnpm run package

      - name: Verify packaged file list
        run: pnpm exec vsce ls --tree --no-dependencies
